<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Markdown Knowledge Search</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- Connection mode badge (top-right). JS toggles the class + text. -->
  <div id="mode-badge" class="badge badge--connecting" title="Connection mode">
    <span class="badge__dot">●</span>
    <span id="mode-label">Connecting…</span>
  </div>

  <main class="container">
    <header class="hero">
      <h1>Knowledge Search</h1>
      <p class="subtitle">Your reading journal, distilled into period reports —
        with AI semantic search over every note below.</p>
    </header>

    <!-- Summary report (top of page). -->
    <section id="report" class="report" aria-labelledby="report-heading">
      <div class="report-bar">
        <h2 id="report-heading" class="report-heading">Summary Report</h2>
        <div class="report-controls">
          <label class="control">
            <span class="control-label">Level</span>
            <select id="report-level" aria-label="Report level">
              <option value="month">Monthly</option>
              <option value="quarter">Quarterly</option>
              <option value="year">Yearly</option>
            </select>
          </label>
          <label class="control">
            <span class="control-label">Period</span>
            <select id="report-period" aria-label="Report period"></select>
          </label>
        </div>
      </div>
      <p id="report-status" class="report-status" aria-live="polite"></p>
      <article id="report-body" class="report-body markdown"></article>
    </section>

    <!-- Search (bottom of page). -->
    <section class="search-section" aria-labelledby="search-heading">
      <h2 id="search-heading" class="search-heading">Search the notes</h2>
      <form id="search-form" class="search-bar" autocomplete="off">
        <input
          id="search-input"
          type="search"
          name="q"
          placeholder="Ask a question or type keywords…"
          aria-label="Search query"
        />
        <button id="search-button" type="submit">Search</button>
      </form>

      <p id="status-line" class="status-line" aria-live="polite"></p>

      <section id="results" class="results" aria-live="polite"></section>
    </section>
  </main>

  <!-- Vendored MiniSearch (UMD) for offline static keyword search. -->
  <script src="vendor/minisearch.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
